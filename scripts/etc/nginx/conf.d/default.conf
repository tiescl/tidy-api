server {
    listen       80;
    server_name  api.tidyapp.uz;

    return 301 https://$server_name$request_uri;
}

map $http_origin $allowed_origin {
    default '';
    'https://tidyapp.uz' $http_origin;
    'https://www.tidyapp.uz' $http_origin;
}

server {
    listen       443 ssl;
    server_name  api.tidyapp.uz;

    ssl_certificate     /etc/nginx/ssl/certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/private-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        alias /usr/share/nginx/swagger/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    location = /openapi.yaml {
        alias /usr/share/nginx/swagger/openapi.yaml;
        add_header Content-Type "text/yaml";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://localhost:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' $allowed_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Cookie, Set-Cookie' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

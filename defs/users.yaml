components:
    schemas:
        UserRole:
            type: string
            enum:
              - pending
              - admin
              - manager
              - recruiter
              - developer

        V1UsersMeRequest:
            type: object
            additionalProperties: false

        V1UsersMeResponse:
            type: object
            additionalProperties: false
            required:
              - id
              - email
              - username
              - role
            properties:
                id:
                    type: string
                    format: uuid
                full_name:
                    type: string
                email:
                    type: string
                username:
                    type: string
                role:
                    $ref: '#/components/schemas/UserRole'

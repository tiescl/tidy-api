components:
    schemas:
        ErrorCode:
            type: string
            description: app-specific code
            enum:
              # special case
              # for db queries
              - OK

              - EMAIL_NOT_FOUND
              - EMAIL_ALREADY_EXISTS
              - FORBIDDEN
              - INVALID_ISSUE_ID
              - INVALID_PASSWORD
              - INVALID_QUERY_PARAMS
              - INVALID_QUEUE_ID
              - INVALID_TOKEN
              - INVALID_USER_ID
              - ISSUE_NOT_FOUND
              - MISSING_ROLE_PERMISSION
              - MISSING_USER_PERMISSION
              - QUEUE_ALREADY_EXISTS
              - QUEUE_NOT_FOUND
              - QUEUE_OWNER_MISMATCH
              - TOKEN_NOT_FOUND
              - USER_NOT_FOUND
              - USERNAME_ALREADY_EXISTS

        ErrorResponse:
            type: object
            additionalProperties: false
            required:
              - code
              - message
            properties:
                code:
                    type: string
                message:
                    type: string
                detail:
                    type: string

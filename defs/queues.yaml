components:
    schemas:
        Queue:
            type: object
            additionalProperties: false
            required:
              - id
              - key
              - name
              - owner_id
              - created_at
            properties:
                id:
                    type: string
                    format: uuid
                key:
                    type: string
                name:
                    type: string
                owner_id:
                    type: string
                    format: uuid
                created_at:
                    type: integer
                    format: int64

        PermissionType:
            type: string
            enum:
              - role
              - user

        V1QueuesRequest:
            type: object
            additionalProperties: false

        V1QueuesResponse:
            type: object
            additionalProperties: false
            required:
              - queues
            properties:
                queues:
                    type: array
                    items:
                        $ref: '#/components/schemas/Queue'

        V1QueuesQueueRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueResponse:
            $ref: '#/components/schemas/Queue'

        V1QueuesPostRequest:
            type: object
            additionalProperties: false
            required:
              - key
              - name
              - owner_id
            properties:
                key:
                    type: string
                    minLength: 4
                    maxLength: 32
                    pattern: ^[A-Z]+$
                name:
                    type: string
                    minLength: 4
                    maxLength: 256
                    pattern: ^[a-zA-Z0-9 _-]+$
                owner_id:
                    type: string
                    format: uuid

        V1QueuesPostResponse:
            type: object
            additionalProperties: false
            required:
              - id
            properties:
                id:
                    type: string
                    format: uuid

        V1QueuesQueueDeleteRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueDeleteResponse:
            type: object
            additionalProperties: false

        V1QueuesQueuePermissionsPostRequest:
            type: object
            additionalProperties: false
            required:
              - actions
              - permission_type
            properties:
                permission_type:
                    $ref: '#/components/schemas/PermissionType'
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                user_id:
                    type: string
                    format: uuid
                actions:
                    type: array
                    minItems: 1
                    items:
                        $ref: issues.yaml#/components/schemas/IssueAction
                    x-usrv-cpp-type: std::unordered_set

        V1QueuesQueuePermissionsPostResponse:
            type: object
            additionalProperties: false

        V1QueuesQueuePermissionsDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - permission_type
            properties:
                permission_type:
                    $ref: '#/components/schemas/PermissionType'
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                user_id:
                    type: string
                    format: uuid

        V1QueuesQueuePermissionsDeleteResponse:
            type: object
            additionalProperties: false

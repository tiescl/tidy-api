openapi: 3.0.0

info:
    title: Tidy Service
    version: '1.0'

servers:
  - url: https://api.tidyapp.uz
    description: production
  - url: http://127.0.0.1:8080
    description: testing

paths:
    /v1/users/me:
        get:
            tags:
              - users
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
            responses:
                200:
                    description: currently authenticated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1UsersMeResponse'
                404:
                    description: user not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
        put:
            tags:
              - users
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
            responses:
                200:
                    description: updated user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1UsersMePutResponse'
                400:
                    description: email/username already exist
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: user not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/users/me/delete:
        post:
            tags:
              - users
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1UsersMeDeleteResponse'
                404:
                    description: user not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/users/me/password:
        put:
            tags:
              - users
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1UsersMePasswordRequest'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1UsersMePasswordResponse'
                400:
                    description: invalid password
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

components:
    schemas:
        UserRole:
            type: string
            enum:
              - pending
              - admin
              - manager
              - recruiter
              - developer

        User:
            type: object
            additionalProperties: false
            required:
              - id
              - email
              - username
              - role
            properties:
                id:
                    type: string
                    format: uuid
                full_name:
                    type: string
                email:
                    type: string
                username:
                    type: string
                role:
                    $ref: '#/components/schemas/UserRole'

        UserRef:
            type: object
            additionalProperties: false
            required:
              - id
              - username
            properties:
                id:
                    type: string
                    format: uuid
                username:
                    type: string

        V1UsersMeRequest:
            type: object
            additionalProperties: false

        V1UsersMeResponse:
            $ref: '#/components/schemas/User'

        V1UsersMePutRequest:
            type: object
            additionalProperties: false
            properties:
                full_name:
                    type: string
                    minLength: 5
                    maxLength: 256
                username:
                    type: string
                    minLength: 3
                    maxLength: 30
                    pattern: ^[A-Za-z][A-Za-z0-9_]+$
                email:
                    type: string
                    minLength: 5
                    maxLength: 254
                    pattern: ^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$

        V1UsersMePutResponse:
            $ref: '#/components/schemas/User'

        V1UsersMeDeleteRequest:
            type: object
            additionalProperties: false

        V1UsersMeDeleteResponse:
            type: object
            additionalProperties: false

        V1UsersMePasswordRequest:
            type: object
            additionalProperties: false
            required:
              - old_password
              - new_password
            properties:
                old_password:
                    type: string
                    minLength: 8
                    maxLength: 128
                new_password:
                    type: string
                    minLength: 8
                    maxLength: 128

        V1UsersMePasswordResponse:
            type: object
            additionalProperties: false

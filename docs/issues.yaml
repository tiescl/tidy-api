components:
    schemas:
        Issue:
            type: object
            additionalProperties: false
            required:
              - id
              - queue
              - number
              - title
              - type
              - status
              - priority
            properties:
                id:
                    type: string
                    format: uuid
                queue:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - key
                    properties:
                        id:
                            type: string
                            format: uuid
                        key:
                            type: string
                number:
                    type: integer
                title:
                    type: string
                description:
                    type: string
                type:
                    $ref: '#/components/schemas/IssueType'
                status:
                    $ref: '#/components/schemas/IssueStatus'
                priority:
                    $ref: '#/components/schemas/IssuePriority'
                component:
                    type: string
                story_points:
                    type: integer
                author:
                    $ref: users.yaml#/components/schemas/UserRef
                assignee:
                    $ref: users.yaml#/components/schemas/UserRef
                created_at:
                    type: integer
                    format: int64
                updated_at:
                    type: integer
                    format: int64

        IssueAction:
            type: string
            enum:
              - view
              - create
              - edit_own
              - edit_any
              - delete_own
              - delete_any

        IssueStatus:
            type: string
            enum:
              - description
              - backlog
              - planned
              - in_progress
              - need_info
              - pull_request
              - merged
              - closed

        IssuePriority:
            type: string
            enum:
              - minor
              - normal
              - critical
              - blocker

        IssueType:
            type: string
            enum:
              - task
              - bug
              - linker
              - epic

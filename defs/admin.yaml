components:
    schemas:
        AdminV1UsersRequest:
            type: object
            additionalProperties: false

        AdminV1UsersResponse:
            type: object
            additionalProperties: false
            required:
              - users
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminUserListItem'

        AdminUserListItem:
            type: object
            additionalProperties: false
            required:
              - id
              - email
              - username
              - role
              - removed
              - created_at
              - updated_at
            properties:
                id:
                    type: string
                    format: uuid
                full_name:
                    type: string
                email:
                    type: string
                username:
                    type: string
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                removed:
                    type: boolean
                created_at:
                    type: integer
                    format: int64
                updated_at:
                    type: integer
                    format: int64

        AdminV1UsersDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - user_ids
            properties:
                user_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                    x-usrv-cpp-type: std::unordered_set

        AdminV1UsersDeleteResponse:
            type: object
            additionalProperties: false

        AdminV1UsersUserRoleRequest:
            type: object
            additionalProperties: false
            required:
              - role
            properties:
                role:
                    $ref: users.yaml#/components/schemas/UserRole

        AdminV1UsersUserRoleResponse:
            type: object
            additionalProperties: false

        AdminV1QueuesRequest:
            type: object
            additionalProperties: false

        AdminV1QueuesResponse:
            type: object
            additionalProperties: false
            required:
              - queues
            properties:
                queues:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminQueueListItem'

        AdminQueueListItem:
            type: object
            additionalProperties: false
            required:
              - id
              - key
              - name
              - owner
              - removed
              - created_at
              - updated_at
            properties:
                id:
                    type: string
                    format: uuid
                key:
                    type: string
                name:
                    type: string
                owner:
                    $ref: users.yaml#/components/schemas/UserRef
                removed:
                    type: boolean
                created_at:
                    type: integer
                    format: int64
                updated_at:
                    type: integer
                    format: int64

        AdminV1QueuesDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - queue_ids
            properties:
                queue_ids:
                    type: array
                    items:
                        type: string
                        format: uuid
                    x-usrv-cpp-type: std::unordered_set

        AdminV1QueuesDeleteResponse:
            type: object
            additionalProperties: false

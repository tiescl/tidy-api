components:
    schemas:
        V1AuthRegisterRequest:
            type: object
            additionalProperties: false
            required:
              - username
              - email
              - password
            properties:
                username:
                    description: Unique username
                    type: string
                    minLength: 3
                    maxLength: 30
                    pattern: ^[A-Za-z][A-Za-z0-9_]+$
                email:
                    description: User email address
                    type: string
                    minLength: 5
                    maxLength: 254
                    pattern: ^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$
                password:
                    description: User password
                    type: string
                    minLength: 8
                    maxLength: 128

        V1AuthRegisterResponse:
            type: object
            additionalProperties: false
            required:
              - id
            properties:
                id:
                    type: string
                    format: uuid

        V1AuthLoginRequest:
            type: object
            additionalProperties: false
            required:
              - email
              - password
            properties:
                email:
                    description: User email address
                    type: string
                    minLength: 5
                    maxLength: 254
                    pattern: ^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$
                password:
                    description: User password
                    type: string
                    minLength: 8
                    maxLength: 128

        V1AuthLoginResponse:
            type: object
            additionalProperties: false

        V1AuthLogoutRequest:
            type: object
            additionalProperties: false

        V1AuthLogoutResponse:
            type: object
            additionalProperties: false

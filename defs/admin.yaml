components:
    schemas:
        AdminV1UsersRequest:
            type: object
            additionalProperties: false

        AdminV1UsersResponse:
            type: object
            additionalProperties: false
            required:
              - users
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminUserListItem'

        AdminUserListItem:
            type: object
            additionalProperties: false
            required:
              - id
              - email
              - username
              - role
              - removed
              - created_at
              - updated_at
            properties:
                id:
                    type: string
                    format: uuid
                full_name:
                    type: string
                email:
                    type: string
                username:
                    type: string
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                removed:
                    type: boolean
                created_at:
                    type: integer
                    format: int64
                updated_at:
                    type: integer
                    format: int64

        AdminV1UsersDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - user_id
            properties:
                user_id:
                    type: string
                    format: uuid

        AdminV1UsersDeleteResponse:
            type: object
            additionalProperties: false

        AdminV1UsersRoleRequest:
            type: object
            additionalProperties: false
            required:
              - role
            properties:
                role:
                    $ref: users.yaml#/components/schemas/UserRole

        AdminV1UsersRoleResponse:
            type: object
            additionalProperties: false

        AdminV1QueuesRequest:
            type: object
            additionalProperties: false

        AdminV1QueuesResponse:
            type: object
            additionalProperties: false
            required:
              - queues
            properties:
                queues:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdminQueueListItem'

        AdminQueueListItem:
            type: object
            additionalProperties: false
            required:
              - id
              - key
              - name
              - owner_id
              - removed
              - created_at
              - updated_at
            properties:
                id:
                    type: string
                    format: uuid
                key:
                    type: string
                name:
                    type: string
                owner_id:
                    type: string
                    format: uuid
                removed:
                    type: boolean
                created_at:
                    type: integer
                    format: int64
                updated_at:
                    type: integer
                    format: int64

        AdminV1QueuesDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - queue_id
            properties:
                queue_id:
                    type: string
                    format: uuid

        AdminV1QueuesDeleteResponse:
            type: object
            additionalProperties: false

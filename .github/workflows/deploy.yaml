name: CI/CD

on:
    schedule:
      - cron: 30 5 * * 1  # Every Monday at 5:30
    push:
        branches:
          - trunk

env:
    OS_VERSION: ubuntu-24.04
    UBSAN_OPTIONS: print_stacktrace=1

jobs:
    build-and-deploy:
        runs-on: ubuntu-24.04

        steps:
          - uses: actions/checkout@v5
            with:
                submodules: true

          - name: setup python
            uses: actions/setup-python@v6
            with:
                python-version: 3.12

          - name: bundle openAPI schemas
            run: |
                pip install pyyaml
                python ./scripts/openapi/bundle.py

          - name: download Swagger
            run: |
                SWAGGER_VERSION='5.31.0'
                wget https://github.com/swagger-api/swagger-ui/archive/refs/tags/v${SWAGGER_VERSION}.tar.gz
                tar -xzf v${SWAGGER_VERSION}.tar.gz

                mkdir -p swagger-ui-dist
                cp -r swagger-ui-${SWAGGER_VERSION}/dist/* swagger-ui-dist/
                cp openapi.yaml swagger-ui-dist/

                cat > swagger-ui-dist/swagger-initializer.js << 'EOF'
                window.onload = function() {
                  window.ui = SwaggerUIBundle({
                    url: "/openapi.yaml",
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                      SwaggerUIBundle.presets.apis,
                      SwaggerUIStandalonePreset
                    ],
                    plugins: [
                      SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout"
                  });
                };
                EOF

          - name: install packages
            run: |
                DEPS_FILE="https://raw.githubusercontent.com/userver-framework/userver/refs/heads/develop/scripts/docs/en/deps/$OS_VERSION.md"
                sudo apt update
                sudo apt install --allow-downgrades -y postgresql-16 libpq-dev=16.* libpq5=16.* $(wget -q -O - ${DEPS_FILE})
                python3 -m pip install -r requirements.txt

                wget https://apt.llvm.org/llvm.sh
                chmod +x llvm.sh
                sudo ./llvm.sh 19

          - name: reuse ccache directory
            uses: actions/cache@v5
            with:
                path: ~/.cache/ccache
                key: $OS_VERSION-ccache-dir-${{github.ref}}-run-${{github.run_number}}
                restore-keys: |
                    $OS_VERSION-ccache-dir-${{github.ref}}-run-
                    $OS_VERSION-ccache-dir-

          - name: Setup ccache
            run: |
                ccache -M 2.0GB
                ccache -s

          - name: build release
            run: make build-release

          - name: test release
            run: make test-release

          - name: install release
            run: make DESTDIR=/tmp/stage install-release

          - name: deploy release
            run: |-
                mkdir -p ~/.ssh
                echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
                chmod 600 ~/.ssh/deploy_key
                ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

                mkdir -p /tmp/stage/etc/tidy-api
                echo '${{ secrets.ENV }}' > /tmp/stage/etc/tidy-api/secrets.env

                rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
                  --rsync-path="sudo rsync" \
                  /tmp/stage/ \
                  ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/

                rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
                  --rsync-path="sudo rsync" \
                  ./postgresql/ \
                  ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/opt/

                rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
                  --rsync-path="sudo rsync" \
                  ./swagger-ui-dist/* \
                  ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/usr/share/nginx/swagger/

                ssh -i ~/.ssh/deploy_key ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
                  "sudo nginx -t && sudo nginx -s reload && sudo systemctl restart tidy-api"

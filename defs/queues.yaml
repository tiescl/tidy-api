components:
    schemas:
        PermissionType:
            type: string
            enum:
              - role
              - user

        V1QueuesPostRequest:
            type: object
            additionalProperties: false
            required:
              - key
              - name
              - owner_id
            properties:
                key:
                    type: string
                    minLength: 4
                    maxLength: 32
                    pattern: ^[A-Z]+$
                name:
                    type: string
                    minLength: 4
                    maxLength: 256
                    pattern: ^[a-zA-Z0-9 _-]+$
                owner_id:
                    type: string
                    format: uuid

        V1QueuesPostResponse:
            type: object
            additionalProperties: false
            required:
              - id
            properties:
                id:
                    type: string
                    format: uuid

        V1QueuesDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - queue_id
            properties:
                queue_id:
                    type: string
                    format: uuid

        V1QueuesDeleteResponse:
            type: object
            additionalProperties: false

        V1QueuesPermissionsPostRequest:
            type: object
            additionalProperties: false
            required:
              - actions
              - permission_type
            properties:
                permission_type:
                    $ref: '#/components/schemas/PermissionType'
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                user_id:
                    type: string
                    format: uuid
                actions:
                    type: array
                    minItems: 1
                    items:
                        $ref: issues.yaml#/components/schemas/IssueAction

        V1QueuesPermissionsPostResponse:
            type: object
            additionalProperties: false

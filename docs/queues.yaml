openapi: 3.0.0

info:
    title: Tidy Service
    version: '1.0'

servers:
  - url: https://api.tidyapp.uz
    description: production
  - url: http://127.0.0.1:8080
    description: testing

paths:
    /v1/queues:
        get:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/SearchQuery
              - $ref: common.yaml#/components/parameters/PageQuery
              - $ref: common.yaml#/components/parameters/LimitQuery
            responses:
                200:
                    description: list of queues
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesResponse'
                400:
                    description: invalid query params
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

        post:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1QueuesPostRequest'
            responses:
                200:
                    description: created queue
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesPostResponse'
                400:
                    description: |
                        one of:
                            queue owner mismatch
                            queue already exists
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: user not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}:
        get:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
            responses:
                200:
                    description: requested queue
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueResponse'
                400:
                    description: invalid queue id
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: queue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/delete:
        post:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueDeleteResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            queue owner mismatch
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: queue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/permissions:
        post:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1QueuesQueuePermissionsPostRequest'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueuePermissionsPostResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            queue owner mismatch
                            missing role permission
                            missing user permission
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: queue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/permissions/delete:
        post:
            tags:
              - queues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1QueuesQueuePermissionsDeleteRequest'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueuePermissionsDeleteResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            queue owner mismatch
                            missing role permission
                            missing user permission
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: queue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/issues:
        post:
            tags:
              - issues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1QueuesQueueIssuesPostRequest'
            responses:
                200:
                    description: created issue
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueIssuesPostResponse'
                400:
                    description: invalid queue id
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                403:
                    description: forbidden (permissions)
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: |
                        one of
                            user not found
                            queue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/issues/{issue}:
        get:
            tags:
              - issues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
              - $ref: common.yaml#/components/parameters/IssueArg
            responses:
                200:
                    description: requested issue
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueIssuesIssueResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            invalid issue id
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                403:
                    description: forbidden (permissions)
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: |
                        one of
                            user not found
                            queue not found
                            issue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
        put:
            tags:
              - issues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
              - $ref: common.yaml#/components/parameters/IssueArg
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/V1QueuesQueueIssuesIssuePutRequest'
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueIssuesIssuePutResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            invalid issue id
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                403:
                    description: forbidden (permissions)
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: |
                        one of
                            user not found
                            queue not found
                            issue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

    /v1/queues/{queue}/issues/{issue}/delete:
        post:
            tags:
              - issues
            parameters:
              - $ref: common.yaml#/components/parameters/SessionIdCookieRequired
              - $ref: common.yaml#/components/parameters/QueueArg
              - $ref: common.yaml#/components/parameters/IssueArg
            responses:
                200:
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/V1QueuesQueueIssuesIssueDeleteResponse'
                400:
                    description: |
                        one of
                            invalid queue id
                            invalid issue id
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                403:
                    description: forbidden (permissions)
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse
                404:
                    description: |
                        one of
                            user not found
                            queue not found
                            issue not found
                    content:
                        application/json:
                            schema:
                                $ref: errors.yaml#/components/schemas/ErrorResponse

components:
    parameters:
        SearchQuery:
            name: search
            in: query
            required: false
            schema:
                type: string
                maxLength: 256

        PageQuery:
            name: page
            in: query
            required: false
            schema:
                type: integer
                minimum: 1

        LimitQuery:
            name: limit
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                maximum: 100

    schemas:
        Queue:
            type: object
            additionalProperties: false
            required:
              - id
              - key
              - name
              - owner
              - created_at
            properties:
                id:
                    type: string
                    format: uuid
                key:
                    type: string
                name:
                    type: string
                owner:
                    $ref: users.yaml#/components/schemas/UserRef
                created_at:
                    type: integer
                    format: int64

        PermissionType:
            type: string
            enum:
              - role
              - user

        V1QueuesRequest:
            type: object
            additionalProperties: false

        V1QueuesResponse:
            type: object
            additionalProperties: false
            required:
              - queues
            properties:
                queues:
                    type: array
                    items:
                        $ref: '#/components/schemas/Queue'

        V1QueuesPostRequest:
            type: object
            additionalProperties: false
            required:
              - key
              - name
              - owner_id
            properties:
                key:
                    type: string
                    minLength: 4
                    maxLength: 32
                    pattern: ^[A-Z]+$
                name:
                    type: string
                    minLength: 4
                    maxLength: 256
                owner_id:
                    type: string
                    format: uuid

        V1QueuesPostResponse:
            $ref: '#/components/schemas/Queue'

        V1QueuesQueueRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueResponse:
            $ref: '#/components/schemas/Queue'

        V1QueuesQueueDeleteRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueDeleteResponse:
            type: object
            additionalProperties: false

        V1QueuesQueuePermissionsPostRequest:
            type: object
            additionalProperties: false
            required:
              - actions
              - permission_type
            properties:
                permission_type:
                    $ref: '#/components/schemas/PermissionType'
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                user_id:
                    type: string
                    format: uuid
                actions:
                    type: array
                    minItems: 1
                    items:
                        $ref: issues.yaml#/components/schemas/IssueAction
                    x-usrv-cpp-type: std::unordered_set

        V1QueuesQueuePermissionsPostResponse:
            type: object
            additionalProperties: false

        V1QueuesQueuePermissionsDeleteRequest:
            type: object
            additionalProperties: false
            required:
              - permission_type
            properties:
                permission_type:
                    $ref: '#/components/schemas/PermissionType'
                role:
                    $ref: users.yaml#/components/schemas/UserRole
                user_id:
                    type: string
                    format: uuid

        V1QueuesQueuePermissionsDeleteResponse:
            type: object
            additionalProperties: false

        V1QueuesQueueIssuesPostRequest:
            type: object
            additionalProperties: false
            required:
              - title
            properties:
                title:
                    type: string
                    minLength: 4
                    maxLength: 256
                description:
                    type: string
                    minLength: 4
                    maxLength: 6000
                type:
                    $ref: issues.yaml#/components/schemas/IssueType
                status:
                    $ref: issues.yaml#/components/schemas/IssueStatus
                priority:
                    $ref: issues.yaml#/components/schemas/IssuePriority
                component:
                    type: string
                    minLength: 4
                    maxLength: 64
                    pattern: ^[a-z0-9_-]+$
                story_points:
                    type: integer
                    minimum: 1
                    maximum: 100
                assignee_id:
                    type: string
                    format: uuid

        V1QueuesQueueIssuesPostResponse:
            $ref: issues.yaml#/components/schemas/Issue

        V1QueuesQueueIssuesIssueRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueIssuesIssueResponse:
            $ref: issues.yaml#/components/schemas/Issue

        V1QueuesQueueIssuesIssueDeleteRequest:
            type: object
            additionalProperties: false

        V1QueuesQueueIssuesIssueDeleteResponse:
            type: object
            additionalProperties: false

        V1QueuesQueueIssuesIssuePutRequest:
            type: object
            additionalProperties: false
            properties:
                title:
                    type: string
                    minLength: 4
                    maxLength: 256
                description:
                    type: string
                    minLength: 4
                    maxLength: 6000
                type:
                    $ref: issues.yaml#/components/schemas/IssueType
                status:
                    $ref: issues.yaml#/components/schemas/IssueStatus
                priority:
                    $ref: issues.yaml#/components/schemas/IssuePriority
                component:
                    type: string
                    minLength: 4
                    maxLength: 64
                    pattern: ^[a-z0-9_-]+$
                story_points:
                    type: integer
                    minimum: 1
                    maximum: 100
                assignee_id:
                    type: string
                    format: uuid

        V1QueuesQueueIssuesIssuePutResponse:
            $ref: issues.yaml#/components/schemas/Issue
